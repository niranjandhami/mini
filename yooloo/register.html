<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LearnOnline</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">L</div>
                <span class="logo-text">LearnOnline</span>
            </a>
            <nav class="main-nav auth-nav">
                <a href="index.html" class="btn btn-ghost"><i class="fas fa-home"></i> Home</a>
            </nav>
        </div>
    </header>

    <main class="auth-main">
        <!-- Registration Form -->
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="auth-icon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2>Create Account</h2>
                        <p>Start your learning journey today</p>
                    </div>

                    <!-- Alert Message -->
                    <div class="alert alert-success" id="successAlert">
                        <i class="fas fa-check-circle"></i> Registration successful! Welcome aboard!
                    </div>

                    <form id="registerForm" novalidate>
                        <div class="form-group">
                            <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
                            <input 
                                type="text" 
                                id="fullName" 
                                name="fullName" 
                                class="form-control" 
                                placeholder="Enter your full name"
                                required
                            >
                            <span class="form-error" id="nameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-control" 
                                placeholder="Enter your email"
                                required
                            >
                            <span class="form-error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                class="form-control" 
                                placeholder="Enter your phone number"
                                required
                            >
                            <span class="form-error" id="phoneError"></span>
                        </div>

                        <div class="form-group">
                            <label for="courseSelect"><i class="fas fa-book"></i> Select Course</label>
                            <select 
                                id="courseSelect" 
                                name="courseSelect" 
                                class="form-control form-select"
                                required
                            >
                                <option value="">Choose a course...</option>
                                <option value="computer-science">Computer Science</option>
                                <option value="engineering">Engineering</option>
                                <option value="business">Business Administration</option>
                                <option value="data-science">Data Science</option>
                                <option value="web-development">Web Development</option>
                                <option value="digital-marketing">Digital Marketing</option>
                            </select>
                            <span class="form-error" id="courseError"></span>
                        </div>

                        <div class="form-group">
                            <label for="registerPassword"><i class="fas fa-lock"></i> Password</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="registerPassword" 
                                    name="registerPassword" 
                                    class="form-control" 
                                    placeholder="Create a password"
                                    required
                                >
                                <button type="button" class="password-toggle" id="passwordToggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-control" 
                                placeholder="Confirm your password"
                                required
                            >
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" required>
                                <span class="checkmark"></span>
                                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>

                        <div class="auth-footer">
                            <p>Already have an account? <a href="login.html">Sign in</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 LearnOnline. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact Us</a>
            </div>
        </div>
    </footer>

    <script src="register.js"></script>
</body>
</html>
